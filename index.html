<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tich Button - Food Lounge Delivery</title>
  <style>
    :root { --primary: #176b3a; --bg: #f5f7f4; --text: #172019; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 30px; }
    header { background: var(--primary); color: white; padding: 20px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
    main { max-width: 600px; margin: auto; padding: 12px; }
    .box { background: white; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .search { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    .categories { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; margin-bottom: 12px; }
    .cat-btn { background: #e8efe9; color: var(--primary); border: none; padding: 6px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 13px; }
    .cat-btn.active { background: var(--primary); color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .product-card { background: white; padding: 12px; border-radius: 12px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .product-icon { font-size: 32px; margin-bottom: 6px; }
    .product-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .product-price { color: #555; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .btn-add { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    .cart-box { position: sticky; bottom: 10px; z-index: 10; border: 2px solid var(--primary); }
    .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty { background: #eee; border: none; width: 26px; height: 26px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .order-btn { background: #25D366; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin: 6px 0; box-sizing: border-box; font-size: 14px; }
    .muted { color: #666; font-size: 13px; }
    .notice { background: #fff3cd; color: #856404; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>

<header>
  <h1>🛵 Tich Button</h1>
  <p>Local Delivery within 5 km of Padinjarathara</p>
</header>

<main>
  <div class="box">
    <input id="search" class="search" placeholder="Search food, shawarma, biriyani..." oninput="renderProducts()">
    <div class="categories" id="categories"></div>
  </div>

  <div id="products" class="grid"></div>

  <div class="box cart-box">
    <h2>🛒 Cart</h2>
    <div id="cart"></div>
    <h3 id="total" style="margin: 12px 0 4px;">Subtotal: ₹0</h3>
    <div class="notice">⚡ Minimum order ₹100 | Delivery charges ₹30–₹50 confirmed based on distance.</div>

    <hr style="margin: 12px 0; border: 0; border-top: 1px solid #eee;">

    <input id="name" placeholder="Your Full Name *">
    <input id="phone" type="tel" placeholder="Mobile Number (10 digits) *">
    <input id="address" placeholder="Delivery Address / Landmark *">
    
    <select id="payment" onchange="togglePayment()">
      <option value="Cash on Delivery">Cash on Delivery (COD)</option>
      <option value="UPI">UPI Payment</option>
    </select>
    
    <div id="upi-info" class="muted" style="display:none; background: #eef7f2; padding: 8px; border-radius: 6px; margin-top: 4px;">
      <b>Pay via GPay / PhonePe / Paytm:</b><br>
      UPI ID: <code>9392896113-6@ybl</code>
    </div>

    <button class="order-btn" onclick="placeOrder()">📲 Place Order on WhatsApp</button>
  </div>
</main>

<script>
const products = [
  // Arabian & Shawarma

  ["Al Faham Normal (Half)", "Arabian", 290, "🍗"],

  ["Shawarma Roll", "Arabian", 90, "🌯"],

  ["Full Meat Plate", "Arabian", 160, "🍽️"],

  ["Porotta Plate", "Arabian", 180, "🍽️"],

  // Manthi
  ["Manthi Normal (Quarter)", "Manthi", 220, "🍛"],

  ["Peri Peri Al Faham Manthi (Quarter)", "Manthi", 280, "🍛"],
  ["Manthi Rice Only", "Manthi", 100, "🍚"],

  // Rice & Biriyani
  ["Chicken Biriyani", "Biriyani", 190, "🍗"],
  ["Egg Biriyani", "Biriyani", 150, "🥚"],
  ["Veg Biriyani", "Biriyani", 140, "🥦"],
  ["Mushroom Biriyani", "Biriyani", 260, "🍄"],
  ["Paneer Biriyani", "Biriyani", 250, "🧀"],
  ["Jeera Rice", "Biriyani", 140, "🍚"],
  ["Biriyani Rice", "Biriyani", 120, "🍚"],

  ["Ghee Rice (Half)", "Biriyani", 90, "🍚"],

  ["Paneer Butter Masala", "Curries", 220, "🧀"],
  ["Kadai Paneer", "Curries", 220, "🧀"],
  ["Veg Kuruma", "Curries", 100, "🥗"],

  // Breads
  ["Porotta", "Breads", 15, "🥞"],
  ["Wheat Porotta", "Breads", 20, "🥞"],
  ["Nool Porotta", "Breads", 20, "🥞"],
  ["Chapathi", "Breads", 14, "🫓"],
  ["Kubz", "Breads", 10, "🫓"],

  ["Veg Burger", "Fast Food", 70, "🍔"],

  ["Unnakkaya", "Snacks", 20, "🍌"],
  ["Macaroni Pola", "Snacks", 30, "🥮"],

  ["Pazham Pori", "Snacks", 12, "🍌"],

  // Beverages & Desserts
  ["Black Tea", "Beverages", 10, "☕"],
  ["Tea", "Beverages", 14, "☕"],
  ["Coffee", "Beverages", 15, "☕"],
  ["Fresh Lime", "Beverages", 20, "🍋"],
  ["Mint Lime", "Beverages", 30, "🍃"],
  ["Watermelon Juice", "Beverages", 60, "🍉"],
  ["Anar Juice", "Beverages", 80, "🧃"],
  ["Orange Juice", "Beverages", 60, "🍊"],
  ["Sharjah Shake", "Beverages", 80, "🥤"],
  ["Normal Falooda", "Beverages", 120, "🍨"],
  ["Royal Falooda", "Beverages", 140, "🍨"]
];

let selectedCategory = "All";
let cart = {};

function initCategories() {
  const cats = ["All", ...new Set(products.map(p => p[1]))];
  document.getElementById('categories').innerHTML = cats.map(c => 
    `<button class="cat-btn ${c === selectedCategory ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`
  ).join('');
}

function filterCat(cat) {
  selectedCategory = cat;
  initCategories();
  renderProducts();
}

function renderProducts() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = products.filter(x => {
    const matchesSearch = x[0].toLowerCase().includes(q);
    const matchesCat = selectedCategory === "All" || x[1] === selectedCategory;
    return matchesSearch && matchesCat;
  });

  document.getElementById('products').innerHTML = filtered.map(x => `
    <div class="product-card">
      <div class="product-icon">${x[3]}</div>
      <div class="product-name">${x[0]}</div>
      <div class="product-price">₹${x[2]}</div>
      <button class="btn-add" onclick="changeQty('${x[0]}', 1)">+ Add</button>
    </div>
  `).join('');
}

function changeQty(name, delta) {
  cart[name] = (cart[name] || 0) + delta;
  if (cart[name] <= 0) delete cart[name];
  drawCart();
}

function drawCart() {
  let subtotal = 0;
  const entries = Object.entries(cart);
  
  if (entries.length === 0) {
    document.getElementById('cart').innerHTML = '<span class="muted">Your cart is empty.</span>';
    document.getElementById('total').textContent = 'Subtotal: ₹0';
    return;
  }

  document.getElementById('cart').innerHTML = entries.map(([name, qty]) => {
    const item = products.find(p => p[0] === name);
    const itemTotal = item[2] * qty;
    subtotal += itemTotal;
    return `
      <div class="cart-row">
        <div>
          <b>${name}</b><br>
          <small class="muted">₹${item[2]} each</small>
        </div>
        <div class="qty-controls">
          <button class="btn-qty" onclick="changeQty('${name}', -1)">-</button>
          <span><b>${qty}</b></span>
          <button class="btn-qty" onclick="changeQty('${name}', 1)">+</button>
          <span style="min-width: 50px; text-align: right;">₹${itemTotal}</span>
        </div>
      </div>`;
  }).join('');

  document.getElementById('total').textContent = 'Subtotal: ₹' + subtotal;
}

function togglePayment() {
  const method = document.getElementById('payment').value;
  document.getElementById('upi-info').style.display = method === 'UPI' ? 'block' : 'none';
}

function placeOrder() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const payment = document.getElementById('payment').value;

  if (!name || !phone || !address) {
    alert('Please fill in your Name, Mobile Number, and Address.');
    return;
  }

  if (Object.keys(cart).length === 0) {
    alert('Your cart is empty.');
    return;
  }

  let subtotal = 0;
  const itemsList = Object.entries(cart).map(([name, qty]) => {
    const item = products.find(p => p[0] === name);
    const lineTotal = item[2] * qty;
    subtotal += lineTotal;
    return `• ${name} x ${qty} = ₹${lineTotal}`;
  }).join('\n');

  if (subtotal < 100) {
    alert('Minimum order value is ₹100. Please add more items to proceed.');
    return;
  }

  const message = 
`*NEW TICH BUTTON ORDER*
----------------------------
*Customer Details:*
👤 *Name:* ${name}
📞 *Phone:* ${phone}
📍 *Address:* ${address}
💳 *Payment:* ${payment}

*Order Items:*
${itemsList}

----------------------------
*Subtotal:* ₹${subtotal}
*Delivery Fee:* ₹30–₹50 (To be confirmed by distance)
*Final Total:* Subtotal + Delivery Fee

Please confirm my order and share estimated delivery time!`;

  const encodedMsg = encodeURIComponent(message);
  window.open(`https://wa.me/919392896113?text=${encodedMsg}`, '_blank');
}

initCategories();
renderProducts();
drawCart();
</script>
</body>
</html>
